<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1a0509;
      color: #fce4ec;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      background: #5c0a1e;
      border-bottom: 2px solid #ff4f8b;
    }
    header h1 { margin: 0; font-size: 1.1rem; color: #ff80ab; }
    header label { font-size: 0.9rem; margin-right: 1rem; }
    header button { margin-left: 0.5rem; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    .msg {
      max-width: 80%;
      padding: 0.6rem 1rem;
      margin: 0.5rem 0;
      border-radius: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .user { background: #c2185b; margin-left: auto; }
    .bot { background: #3b0d1a; border: 1px solid #7a1230; }
    .msg p { margin: 0.3rem 0; }
    .msg pre {
      background: #1a0509;
      padding: 0.8rem;
      overflow-x: auto;
      border-radius: 6px;
    }
    .msg code { background: #1a0509; padding: 0.1rem 0.3rem; border-radius: 4px; }
    .msg pre code { padding: 0; }
    .msg a { color: #ff80ab; }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      background: #2a0711;
      border-top: 1px solid #7a1230;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.7rem;
      border: 1px solid #7a1230;
      border-radius: 6px;
      background: #1a0509;
      color: #fce4ec;
    }
    input[type="text"]:focus { outline: 2px solid #ff4f8b; }
    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 6px;
      background: #ff4f8b;
      color: #1a0509;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #ff80ab; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Chatbot</h1>
    <div>
      <label><input type="checkbox" id="useHistory" checked> Save history</label>
      <button id="clear" type="button">Clear</button>
    </div>
  </header>

  <div id="messages"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script>
    // Change this to your server
    const API_URL = "http://localhost:3000/chat";

    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const useHistory = document.getElementById("useHistory");
    const clearBtn = document.getElementById("clear");

    // Load saved settings and history
    let chat = [];
    try {
      chat = JSON.parse(localStorage.getItem("chat_history")) || [];
      useHistory.checked = localStorage.getItem("use_history") !== "false";
    } catch {}

    function render(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (role === "bot") {
        div.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        div.textContent = text;
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function save() {
      if (useHistory.checked) {
        localStorage.setItem("chat_history", JSON.stringify(chat));
      }
    }

    // Show saved messages on load
    if (useHistory.checked) {
      chat.forEach((m) => render(m.role, m.text));
    } else {
      chat = [];
    }

    useHistory.addEventListener("change", () => {
      localStorage.setItem("use_history", useHistory.checked);
      if (!useHistory.checked) {
        localStorage.removeItem("chat_history");
      } else {
        save();
      }
    });

    clearBtn.addEventListener("click", () => {
      chat = [];
      messagesEl.innerHTML = "";
      localStorage.removeItem("chat_history");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      input.value = "";
      sendBtn.disabled = true;

      // Only send past messages when history is on
      const historyPrompt = useHistory.checked
        ? chat.map((m) => (m.role === "user" ? "User: " : "Assistant: ") + m.text).join("\n")
        : "";

      render("user", question);
      const bot = render("bot", "Thinking...");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history_prompt: historyPrompt, current_prompt: question }),
        });
        const data = await res.json();
        const markdown = data.markdown || data.error || "No response";
        bot.innerHTML = DOMPurify.sanitize(marked.parse(markdown));

        if (useHistory.checked) {
          chat.push({ role: "user", text: question });
          chat.push({ role: "bot", text: markdown });
          save();
        }
      } catch {
        bot.textContent = "Could not reach the server.";
      }

      sendBtn.disabled = false;
      input.focus();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  </script>
</body>
</html>
